
<div class="bg-gray-800 p-4 rounded-lg text-center border-2 border-dashed border-gray-600 hover:border-blue-500 transition-colors duration-300 h-full flex flex-col justify-center items-center"
     [class.border-blue-500]="isDragging()"
     (dragover)="onDragOver($event)"
     (dragleave)="onDragLeave($event)"
     (drop)="onDrop($event)">

  @if (imagePreview()) {
    <div class="relative w-full h-full p-2">
      <img [src]="imagePreview()" alt="Image preview" class="w-full h-full object-contain rounded-md">
      <button (click)="removeImage()" class="absolute top-0 right-0 bg-red-600 hover:bg-red-700 text-white rounded-full p-1.5 transition-colors shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
      <p class="text-xs text-gray-400 mt-2 truncate absolute bottom-0 left-1/2 -translate-x-1/2 w-full px-2 bg-gray-900/50 py-1">{{ fileName() }}</p>
    </div>
  } @else {
    <label [for]="title()" class="cursor-pointer flex flex-col items-center justify-center w-full h-full">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="icon()" />
      </svg>
      <h3 class="text-lg font-semibold text-gray-200">{{ title() }}</h3>
      <p class="text-sm text-gray-500">Drag & drop or click to upload</p>
      <p class="text-xs text-gray-500 mt-1">PNG, JPG</p>
    </label>
    <input type="file" [id]="title()" class="hidden" accept="image/png, image/jpeg" (change)="onFileSelected($event)">
  }
</div>
